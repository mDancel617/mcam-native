# XcodeGen spec — optional convenience for generating the Xcode project.
#
# If you have XcodeGen installed (brew install xcodegen), run:
#     xcodegen generate
# from this folder and open LeicaStyleCam.xcodeproj.
#
# If you do NOT want to use XcodeGen, follow the "Manual setup" path in
# README.md instead — it takes about five minutes and needs nothing extra.

name: LeicaStyleCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  LeicaStyleCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.leicastylecam
        PRODUCT_NAME: M-Cam
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Resources/Info.plist
